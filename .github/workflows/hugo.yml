name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.138.0
      # sha256 of hugo_extended_0.138.0_linux-amd64.deb from the v0.138.0 release; update together with HUGO_VERSION
      HUGO_DEB_SHA256: 05c36b1588a6aa6642e68cbeca065246d0763a058390bb4aee9597a33031292c
      HUGO_ENVIRONMENT: production
    steps:
      - name: Install Hugo (pinned, checksum-verified)
        run: |
          cd "${{ runner.temp }}"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSLO "${base}/${deb}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          echo "${HUGO_DEB_SHA256}  ${deb}" | sha256sum --check --strict
          grep " ${deb}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check --strict
          sudo dpkg -i "${deb}"
          hugo version
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build with Hugo
        run: hugo --gc --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
