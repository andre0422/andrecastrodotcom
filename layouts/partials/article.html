<input type="checkbox" id="hamburger-toggle" class="hamburger-checkbox">
<label for="hamburger-toggle" class="hamburger-menu">
    <span></span>
    <span></span>
    <span></span>
</label>

<div class="side-nav-container">
    <div class="side-nav-wrapper">
        {{ if .TableOfContents }}
            {{ partial "sidebar.html" . }}
        {{ end }}
        <div class="sidebar-toggle">
            {{ partial "lightdarktoggle.html" . }}
        </div>
    </div>
</div>

<article id="article-page">
    <header class="article-header">
        <h1 class="article-title">{{ .Title }}</h1>
        {{ if .Params.subtitle }}
        <p class="article-subtitle">{{ .Params.subtitle }}</p>
        {{ end }}
        <div class="article-meta">
            <span class="article-date">{{ .Date.Format "January 2, 2006" }} · {{ .ReadingTime }} min read</span>
        </div>
    </header>

    <div class="article-content">
        {{ .Content }}
    </div>
</article>
